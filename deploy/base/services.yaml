# Generated shape is identical per service; differences go in overlays.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane
  labels: {app: control-plane}
spec:
  replicas: 2
  selector:
    matchLabels: {app: control-plane}
  template:
    metadata:
      labels: {app: control-plane}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: control-plane
          image: registry.local/aisec/control-plane:dev
          imagePullPolicy: Always
          ports: [{containerPort: 8080, name: http}]
          # Secret control-plane (out of band): DATABASE_URL, KAFKA_BROKERS, SCHEMA_REGISTRY_URL, TENANT_ID, TENANT_PEPPER (ticket 37), PUBLIC_URL,
          # OIDC_ISSUER, OIDC_AUDIENCE, OIDC_MFA_ACR, BREAK_GLASS_SUBS, SCIM_TOKEN_SHA256 (ADR-0002), MCP_GATEWAY_TOKEN_SHA256 (tickets 29-30), APPROVAL_TTL, APPROVAL_WEBHOOK_URL (ticket 30),
          # OPENSEARCH_URL, OPENSEARCH_USER, OPENSEARCH_PASSWORD (policy simulation reads stored events),
          # CATALOG_FEED_URL + CATALOG_FEED_PUBKEY_FILE (signed AI app catalog feed, ticket 16; optional).
          envFrom: [{secretRef: {name: control-plane}}]
          env:
            - {name: BUNDLE_SIGNING_KEY_FILE, value: /keys/bundle.key}
            - {name: INCIDENT_KEK_FILE, value: /kek/incident.kek}
          volumeMounts:
            - {name: bundle-signing, mountPath: /keys, readOnly: true}
            - {name: incident-kek, mountPath: /kek, readOnly: true}
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        # PEM EC P-256 private key, provisioned out of band (Vault/HSM-backed in production). Never in git.
        - {name: bundle-signing, secret: {secretName: policy-bundle-signing}}
        # 32 random bytes wrapping per-incident evidence keys (KMS/HSM in production).
        - {name: incident-kek, secret: {secretName: incident-kek}}
---
apiVersion: v1
kind: Service
metadata:
  name: control-plane
spec:
  selector: {app: control-plane}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-gateway
  labels: {app: ai-gateway}
spec:
  replicas: 2
  selector:
    matchLabels: {app: ai-gateway}
  template:
    metadata:
      labels: {app: ai-gateway}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ai-gateway
          image: registry.local/aisec/ai-gateway:dev
          imagePullPolicy: Always
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
        # PDP sidecar (FR-POL-1): verifies the Policy Service bundle signature before activating it.
        - name: opa
          image: registry.local/aisec/opa:dev
          imagePullPolicy: Always
          args:
            - run
            - --server
            - --addr=127.0.0.1:8181  # only the PEP in this pod may ask for decisions
            - --diagnostic-addr=:8282
            - --config-file=/config/opa.yaml
            - --set-file=keys.aisec-policy.key=/keys/bundle.pub
            - --optimize-store-for-read-speed
          ports: [{containerPort: 8282, name: opa-diag}]
          # Not ready until a verified bundle is active: no PEP traffic on an empty policy.
          readinessProbe: {httpGet: {path: "/health?bundles", port: opa-diag}}
          livenessProbe: {httpGet: {path: /health, port: opa-diag}}
          volumeMounts:
            - {name: opa-config, mountPath: /config, readOnly: true}
            - {name: bundle-pubkey, mountPath: /keys, readOnly: true}
            - {name: opa-cache, mountPath: /var/opa}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - {name: opa-config, configMap: {name: opa-config}}
        # bundle.pub: public half of policy-bundle-signing, provisioned with it.
        - {name: bundle-pubkey, configMap: {name: policy-bundle-pubkey}}
        - {name: opa-cache, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-gateway
spec:
  selector: {app: ai-gateway}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detection-svc
  labels: {app: detection-svc}
spec:
  replicas: 2
  selector:
    matchLabels: {app: detection-svc}
  template:
    metadata:
      labels: {app: detection-svc}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: detection-svc
          image: registry.local/aisec/detection-svc:dev
          imagePullPolicy: Always
          ports: [{containerPort: 8080, name: http}]
          # Secret detection-svc (out of band, optional): DATABASE_URL (read-only role on similarity.docs), TENANT_ID,
          # TENANT_PEPPER (same as control-plane) for registered confidential documents (ticket 37).
          envFrom: [{secretRef: {name: detection-svc, optional: true}}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 512Mi}  # similarity index in memory: ~16 KB per registered 5k-word document
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: detection-svc
spec:
  selector: {app: detection-svc}
  ports: [{port: 80, targetPort: http, name: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-inference
  labels: {app: model-inference}
spec:
  replicas: 2
  selector:
    matchLabels: {app: model-inference}
  template:
    metadata:
      labels: {app: model-inference}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: model-inference
          image: registry.local/aisec/model-inference:dev
          imagePullPolicy: Always
          ports: [{containerPort: 8080, name: http}]
          readinessProbe: {httpGet: {path: /healthz, port: http}}
          livenessProbe: {httpGet: {path: /healthz, port: http}}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: model-inference
spec:
  selector: {app: model-inference}
  ports: [{port: 80, targetPort: http, name: http}]
